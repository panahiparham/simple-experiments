[project]
name = "simple-experiments"
version = "0.1.0"
description = "Declarative sweeps, sharded runs, and a SQLite results store."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.26",
    "polars>=1.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/experiment"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PL", "RUF", "S",
    "PYI", "PT",
]
ignore = ["S603"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S301", "PLR2004"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
