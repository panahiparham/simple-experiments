[project]
name = "simple-experiments"
version = "0.1.0"
description = "Declarative sweeps, sharded runs, and a SQLite results store."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.26",
    "polars>=1.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/experiment"]
